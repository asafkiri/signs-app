name: Reference review
on:
  push:
    branches: [fix/familiar-sign-editor]
    paths: [.github/workflows/reference-review.yml]
permissions:
  contents: read
jobs:
  reference:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Collect public reference and current app sources
        run: |
          mkdir -p review/reference review/current
          curl --fail --retry 2 --max-time 60 https://raw.githubusercontent.com/asafkiri/yotvata-app/main/index.html -o review/reference/yotvata.html
          cp *.js *.html *.css *.json *.webmanifest *.svg review/current/
          cp -r tests review/current/
          cp README.md review/current/
      - uses: actions/upload-artifact@v4
        with:
          name: sign-ui-reference
          path: review/
          retention-days: 1
